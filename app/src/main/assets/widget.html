<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка.29 — виджет</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Arial,sans-serif}body{background:#f3f6fb;color:#0b1f33}.wrap{max-width:640px;margin:auto;padding:14px}.logo{font-weight:800;font-size:20px;color:#0d4cd3;margin-bottom:10px}.tabs{display:flex;gap:6px;margin-bottom:12px}.tab{flex:1;padding:9px 4px;border:0;border-radius:10px;background:#e7ecf3;color:#33373d;font-size:13px;font-weight:600}.tab.on{background:#0d4cd3;color:#fff}.card{background:#fff;border:1px solid #e4eaf1;border-radius:14px;padding:16px;margin-bottom:12px}.inp{width:100%;padding:10px;border:1px solid #cdd6e0;border-radius:10px;font-size:14px;margin:6px 0}.btn{background:#0d4cd3;color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:600;text-decoration:none;display:inline-block}.bar{height:10px;background:#e7ecf3;border-radius:6px;margin:10px 0;overflow:hidden}.bar>div{height:100%;border-radius:6px}.ok{color:#0f5f34;font-weight:600}.warn{color:#b7791f;font-weight:600}.bad{color:#8c1d18;font-weight:600}li{margin:4px 0 0 18px;font-size:13px}small{color:#64778c}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #e4eaf1;padding:6px;text-align:left}th{background:#f0f4f9}.tar{padding:10px;border:1px solid #e4eaf1;border-radius:12px;margin-bottom:8px}.price{float:right;font-weight:800;color:#0d4cd3}
</style></head><body><div class="wrap"><div class="logo">Проверка<span style="color:#0b1f33">.29</span></div>
<div class="tabs"><button class="tab on" onclick="show(0)">Проверка сайта</button><button class="tab" onclick="show(1)">Реестр</button><button class="tab" onclick="show(2)">Тарифы</button></div>
<div class="pane"><div class="card"><b>Проверка сайта на фишинг</b><input class="inp" id="url" placeholder="например, shop-example.ru"><button class="btn" onclick="scan()">Сканировать</button><div id="res"></div></div></div>
<div class="pane" hidden><div class="card"><b>Реестр доверия</b><input class="inp" id="q" placeholder="название, ИНН или категория…" oninput="render()"><div id="reg"></div></div></div>
<div class="pane" hidden><div class="card"><b>Тарифы на проверку</b><div class="tar"><span class="price">1 500 ₽</span><b>Стандарт</b><br><small>Отчёт в течение 14 дней</small></div><div class="tar"><span class="price">3 500 ₽</span><b>Ускоренное</b><br><small>Отчёт в течение 5 дней</small></div><div class="tar"><span class="price">7 000 ₽</span><b>Приоритет</b><br><small>Отчёт в течение 48 часов</small></div><a class="btn" href="https://proverka29.ru/zayavka.php">Подать заявку</a></div></div></div>
<script>
var REGISTRY=[{org:'ООО Ромашка',inn:'2925000000',cat:'продукты'},{org:'ИП Смирнова А.В.',inn:'290100123456',cat:'услуги'},{org:'ООО Поморье-Тех',inn:'2902000999',cat:'техника'}];
var BRANDS=['сбербанк','sber','ozon','озон','госуслуги','gosuslugi','wildberries','тинькофф','tinkoff','авито','avito'];
function show(i){var p=document.getElementsByClassName('pane'),t=document.getElementsByClassName('tab');for(var j=0;j<p.length;j++){p[j].hidden=j!==i;t[j].className='tab'+(j===i?' on':'');}}
function scan(){var u=document.getElementById('url').value.trim().toLowerCase();if(!u)return;if(!/^https?:\/\//.test(u))u='http://'+u;var score=0,marks=[],host='',m=u.match(/^https?:\/\/([^\/]+)/);if(m)host=m[1];if(/^\d+\.\d+\.\d+\.\d+$/.test(host)){score+=40;marks.push('Вместо домена указан IP-адрес');}if(host.indexOf('xn--')>=0){score+=25;marks.push('Punycode-домен — возможна подмена букв');}for(var i=0;i<BRANDS.length;i++){if(host.indexOf(BRANDS[i])>=0&&!new RegExp('(^|\\.)'+BRANDS[i]+'\\.(ru|com|net|org)$').test(host)){score+=35;marks.push('Домен маскируется под бренд «'+BRANDS[i]+'»');break;}}if(/-security|login-|-verify|secure-|-account/.test(host)){score+=15;marks.push('Подозрительное имя домена');}if(u.indexOf('http://')===0){score+=20;marks.push('Нет шифрования (http вместо https)');}var verdict=score>=60?'Высокий риск фишинга':score>=30?'Есть подозрительные признаки':'Явных признаков фишинга не найдено';var cls=score>=60?'bad':score>=30?'warn':'ok';var col=score>=60?'#e5484d':score>=30?'#e2a03f':'#27a566';var h='<div class="bar"><div style="width:'+Math.min(score,100)+'%;background:'+col+'"></div></div><div class="'+cls+'">Оценка риска: '+score+'/100 — '+verdict+'</div>';if(marks.length)h+='<ul>'+marks.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>';h+='<small>Эвристическая оценка по домену, не полный антивирус. Полная проверка — proverka29.ru</small>';document.getElementById('res').innerHTML=h;}
function render(){var q=document.getElementById('q').value.trim().toLowerCase();var rows=REGISTRY.filter(function(r){return !q||(r.org+' '+r.inn+' '+r.cat).toLowerCase().indexOf(q)>=0;});var h='';if(!rows.length)h='<small>Ничего не найдено</small>';else{h='<table><tr><th>Организация</th><th>ИНН</th><th>Категория</th></tr>';rows.forEach(function(r){h+='<tr><td>'+r.org+'</td><td>'+r.inn+'</td><td>'+r.cat+'</td></tr>';});h+='</table>';}document.getElementById('reg').innerHTML=h;}render();
</script></body></html>
